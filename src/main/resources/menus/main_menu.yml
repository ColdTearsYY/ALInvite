config_version: 1
main_menu:
  title: "&6&l邀请系统"
  shape:
    - "####O####"
    - "#A#C#P#B#"
    - "#S#H#D#G#"
    - "####X####"
  items:
    O:
      material: CLOCK
      name: "&e&l邀请额度"
      lore:
        - "&7可用 &a%invite_available_count% &7｜预留 &e%quota_reserved% &7｜容量 &f%quota_capacity%"
        - "&7累计在线 &e%playtime% &7｜规则组 &f%quota_group%"
        - "%quota_progress%"
        - "%quota_notice%"
        - "&a点击刷新"
      triggers: { left: [refresh_main] }
    A:
      material: WRITABLE_BOOK
      name: "%bind_title%"
      lore:
        - "&7状态 &f%bind_status% &7｜邀请人 &f%inviter_name%"
        - "%bind_hint%"
      triggers: { left: [input_code] }
    C:
      material: PAPER
      name: "&a我的邀请码"
      lore: ["&7可用 &a%invite_available_count% &7个", "&a点击查看、复制并分享"]
      triggers: { left: [open_codes] }
    P:
      material: CLOCK
      name: "&e我的预邀请"
      lore: ["&7查看已预留给谁、到期时间和剩余时长", "&a点击新建或管理预邀请"]
      triggers: { left: [open_pending] }
    B:
      material: DIAMOND
      name: "&b邀请里程碑"
      lore: ["&7已邀请 &e%total_invites% &7人", "&7下一里程碑 &e%next_milestone%", "&a点击查看和领取"]
      triggers: { left: [open_veteran] }
    S:
      material: GOLD_INGOT
      name: "&6领取充值返利"
      lore: ["&7累计 &e%total_rebate% &7｜待领取 &a%unclaimed_rebate%", "&7当前比例 &e%rebate_rate%", "%contribution_info%", "&a点击领取待领返利"]
      triggers: { left: [claim_rebate], right: [open_rebate_history] }
    H:
      material: BOOK
      name: "&6返利记录"
      lore: ["&7查询返利到账和领取记录"]
      triggers: { left: [open_rebate_history] }
    D:
      material: EXPERIENCE_BOTTLE
      name: "&b奖励处理记录"
      lore: ["&7查看本人的奖励及白名单登记状态"]
      triggers: { left: [open_deliveries] }
    G:
      material: CHEST
      name: "&b礼包商店"
      lore: ["&7当前礼包 &f%gift_name%", "&a点击选购或切换"]
      triggers: { left: [open_shop] }
    X:
      material: BARRIER
      name: "&c关闭"
      triggers: { left: [close] }
    "#":
      material: BLACK_STAINED_GLASS_PANE
      name: ' '
