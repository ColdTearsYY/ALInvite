config_version: 1

admin_rebate_history:
  title: "&6&l%target_name% 的返利记录"
  shape:
    - "####T####"
    - "#RRRRRRR#"
    - "#RRRRRRR#"
    - "#RRRRRRR#"
    - "#RRRRRRR#"
    - "P#X#A#H#N"
  items:
    T:
      material: 'GOLD_INGOT'
      name: "&6&l%target_name% 的返利信息"
      lore:
        - "&e▸ &7累计返点: &e%total_rebate%"
        - "&a▸ &7未领取: &a%unclaimed_rebate%"
        - "&6▸ &7返点比例: &e%rebate_rate%"
    R:
      dynamic: true
      material: 'PAPER'
      name: "&6&l%record_time%"
      lore:
        - "&e▸ %record_text%"
        - "&7来源/经手人: &f%record_source%"
      states:
        claim:
          material: 'BOOK'
          name: "&b&l%record_time%"
    A:
      material: 'LEVER'
      name: "&e&l切换视图"
      lore:
        - "&7当前视图: &e%view_name%"
      states:
        claim:
          material: 'REPEATER'
      triggers:
        left:
          - 'toggle_admin_rebate_view'
    H:
      material: 'OAK_DOOR'
      name: "&a&l返回主菜单"
      triggers:
        left:
          - 'open_main'
    X:
      material: 'BARRIER'
      name: "&c&l关闭"
      triggers:
        left:
          - 'close'
    P:
      material: 'ARROW'
      name: "&a&l上一页"
      lore:
        - "%prev_page_hint%"
      triggers:
        left:
          - 'prev_page'
    N:
      material: 'ARROW'
      name: "&a&l下一页"
      lore:
        - "%next_page_hint%"
      triggers:
        left:
          - 'next_page'

    "#":
      material: 'BLACK_STAINED_GLASS_PANE'
      name: ' '
