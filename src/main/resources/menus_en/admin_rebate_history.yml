config_version: 1

admin_rebate_history:
  title: "&6&l%target_name%'s Rebate History"
  shape:
    - "####T####"
    - "#RRRRRRR#"
    - "#RRRRRRR#"
    - "#RRRRRRR#"
    - "#RRRRRRR#"
    - "P#X#A#H#N"
  items:
    T:
      material: 'GOLD_INGOT'
      name: "&6&l%target_name%'s Rebate Info"
      lore:
        - "&e▸ &7Total rebates: &e%total_rebate%"
        - "&a▸ &7Unclaimed: &a%unclaimed_rebate%"
        - "&6▸ &7Rebate rate: &e%rebate_rate%"
    R:
      dynamic: true
      material: 'PAPER'
      name: "&6&l%record_time%"
      lore:
        - "&e▸ %record_text%"
        - "&7Source/handler: &f%record_source%"
      states:
        claim:
          material: 'BOOK'
          name: "&b&l%record_time%"
    A:
      material: 'LEVER'
      name: "&e&lToggle View"
      lore:
        - "&7Current view: &e%view_name%"
      states:
        claim:
          material: 'REPEATER'
      triggers:
        left:
          - 'toggle_admin_rebate_view'
    H:
      material: 'OAK_DOOR'
      name: "&a&lBack to Main Menu"
      triggers:
        left:
          - 'open_main'
    X:
      material: 'BARRIER'
      name: "&c&lClose"
      triggers:
        left:
          - 'close'
    P:
      material: 'ARROW'
      name: "&a&lPrevious Page"
      lore:
        - "%prev_page_hint%"
      triggers:
        left:
          - 'prev_page'
    N:
      material: 'ARROW'
      name: "&a&lNext Page"
      lore:
        - "%next_page_hint%"
      triggers:
        left:
          - 'next_page'

    "#":
      material: 'BLACK_STAINED_GLASS_PANE'
      name: ' '
