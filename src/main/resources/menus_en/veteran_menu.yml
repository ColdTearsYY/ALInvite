# ALInvite invite center / milestone menu (English)

config_version: 1

veteran_menu:
  title: "&6&lInvite Center"
  shape:
    - "####G####"
    - "#MMMMMMM#"
    - "#MMMMMMM#"
    - "#MMMMMMM#"
    - "#MMMMMMM#"
    - "P#B#H#R#N"
  items:
    B:
      material: 'CHEST'
      custom_model_data: 0
      name: "&b&lGift Shop"
      lore:
        - "&6▶ &8Gift Shop"
        - "&e▸ &7Buy gifts to boost rewards for players you invite"
        - ""
        - "&6▶ &8Actions"
        - "&7• &aLeft click &a➤ &fOpen the gift shop"
      triggers:
        left:
          - 'open_shop'
    G:
      material: 'NETHER_STAR'
      custom_model_data: 0
      name: "&e&lCurrent Gift"
      lore:
        - "&6▶ &8Current Gift"
        - "&e▸ &7Gift name: &f%gift_name%"
        - "&a▸ &7Remaining: &f%gift_remaining_days%"
        - ""
        - "&6▶ &8Gift Contents"
        - "%gift_reward_lore%"
        - ""
        - "&6▶ &8Actions"
        - "&7• &aLeft click &a➤ &fOpen the shop to switch"
      triggers:
        left:
          - 'open_shop'
    M:
      dynamic: true
      material: 'GOLD_BLOCK'
      custom_model_data: 0
      name: "&6&l%milestone_name%"
      lore:
        - "&6▶ &8Milestone"
        - "&e▸ &7Progress: &e%current%&7/&a%required%"
        - "&a▸ &7Status: &f%milestone_status%"
        - ""
        - "&6▶ &8Reward Preview"
        - "%reward_lore%"
        - ""
        - "&6▶ &8Actions"
        - "&7• &aLeft click &a➤ &fClaim the reward"
      states:
        locked:
          material: 'RED_STAINED_GLASS_PANE'
          name: "&c&l%milestone_name%"
          lore:
            - "&6▶ &8Milestone"
            - "&c▸ &7Progress: &c%current%&7/&a%required%"
            - "&c▸ &7Status: &cLocked"
            - "&c▸ &7&c%remaining% &7more invites needed"
            - ""
            - "&6▶ &8Reward Preview"
            - "%reward_lore%"
        claimed:
          material: 'NETHER_STAR'
          name: "&a&l%milestone_name%"
          lore:
            - "&6▶ &8Milestone"
            - "&a▸ &7Progress: &a%current%&7/&a%required%"
            - "&a▸ &7Status: &a✔ Claimed"
            - ""
            - "&6▶ &8Reward Preview"
            - "%reward_lore%"
        available:
          material: 'GOLD_INGOT'
          name: "&6&l%milestone_name%"
          lore:
            - "&6▶ &8Milestone"
            - "&e▸ &7Progress: &e%current%&7/&a%required%"
            - "&6▸ &7Status: &e✔ Ready to claim"
            - ""
            - "&6▶ &8Reward Preview"
            - "%reward_lore%"
            - ""
            - "&6▶ &8Actions"
            - "&7• &aLeft click &a➤ &fClaim the reward"
      triggers:
        left:
          - 'claim_milestone:%milestone_required%'
    H:
      material: 'OAK_DOOR'
      custom_model_data: 0
      name: "&a&lBack to Main Menu"
      lore:
        - "&6▶ &8Actions"
        - "&7• &aLeft click &a➤ &fReturn to the main menu"
      triggers:
        left:
          - 'open_main'
    R:
      material: 'ARROW'
      custom_model_data: 0
      name: "&a&lBack"
      lore:
        - "&6▶ &8Actions"
        - "&7• &aLeft click &a➤ &fReturn to the previous menu"
      triggers:
        left:
          - 'back'
    P:
      material: 'ARROW'
      custom_model_data: 0
      name: "&a&lPrevious Page"
      lore:
        - "&6▶ &8Pagination"
        - "&e▸ &7Page: &e%page%&7/&f%total_pages%"
        - "%prev_page_hint%"
      triggers:
        left:
          - 'prev_page'
    N:
      material: 'ARROW'
      custom_model_data: 0
      name: "&a&lNext Page"
      lore:
        - "&6▶ &8Pagination"
        - "&e▸ &7Page: &e%page%&7/&f%total_pages%"
        - "%next_page_hint%"
      triggers:
        left:
          - 'next_page'

    "#":
      material: 'BLACK_STAINED_GLASS_PANE'
      custom_model_data: 0
      name: ' '
