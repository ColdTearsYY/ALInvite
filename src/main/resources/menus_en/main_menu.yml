config_version: 1
main_menu:
  title: "&6&lInvitations"
  shape:
    - "####O####"
    - "#A#C#P#B#"
    - "#S#H#D#G#"
    - "####X####"
  items:
    O:
      material: CLOCK
      name: "&e&lInvite Quota"
      lore:
        - "&7Available &a%invite_available_count% &7| Reserved &e%quota_reserved% &7| Capacity &f%quota_capacity%"
        - "&7Playtime &e%playtime% &7| Group &f%quota_group%"
        - "%quota_progress%"
        - "%quota_notice%"
        - "&aClick to refresh"
      triggers: { left: [refresh_main] }
    A:
      material: WRITABLE_BOOK
      name: "%bind_title%"
      lore:
        - "&7Status &f%bind_status% &7| Invited by &f%inviter_name%"
        - "%bind_hint%"
      triggers: { left: [input_code] }
    C:
      material: PAPER
      name: "&aMy Invite Codes"
      lore: ["&7Available &a%invite_available_count%", "&aClick to view, copy and share"]
      triggers: { left: [open_codes] }
    P:
      material: CLOCK
      name: "&eMy Pending Invites"
      lore: ["&7See invitees and expiry times", "&aClick to create or manage invites"]
      triggers: { left: [open_pending] }
    B:
      material: DIAMOND
      name: "&bInvite Milestones"
      lore: ["&7Players invited &e%total_invites%", "&7Next milestone &e%next_milestone%", "&aClick to view and claim"]
      triggers: { left: [open_veteran] }
    S:
      material: GOLD_INGOT
      name: "&6Claim Recharge Rebate"
      lore: ["&7Total &e%total_rebate% &7| Unclaimed &a%unclaimed_rebate%", "&7Current rate &e%rebate_rate%", "%contribution_info%", "&aClick to claim"]
      triggers: { left: [claim_rebate], right: [open_rebate_history] }
    H:
      material: BOOK
      name: "&6Rebate History"
      lore: ["&7View rebate credits and claims"]
      triggers: { left: [open_rebate_history] }
    D:
      material: EXPERIENCE_BOTTLE
      name: "&bReward Delivery History"
      lore: ["&7View your rewards and whitelist registration status"]
      triggers: { left: [open_deliveries] }
    G:
      material: CHEST
      name: "&bGift Shop"
      lore: ["&7Current gift &f%gift_name%", "&aClick to buy or switch gifts"]
      triggers: { left: [open_shop] }
    X:
      material: BARRIER
      name: "&cClose"
      triggers: { left: [close] }
    "#":
      material: BLACK_STAINED_GLASS_PANE
      name: ' '
