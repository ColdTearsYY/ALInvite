    registration_close_success: "&a已关闭开放注册，未使用的隐藏注册码已作废"
    registration_failed: "&c生成隐藏注册码失败，请检查控制台日志"

# 绑定 / 输入对话框
dialog:
  prompt: "&a请输入邀请码（输入 {cancel_key} 取消）"
  success: "&a邀请码验证成功！你获得了奖励"
  fail: "&c邀请码无效"
  empty_code: "&c邀请码不能为空！"
  timeout: "&c输入超时，请重新点击按钮"
  cancel: "&c已取消邀请码输入"
  ip_limit: "&c你的 IP 已被其他玩家使用过邀请码"
  self_invite: "&c你不能使用自己的邀请码"

# 未绑定登录限制
binding_gate:
  join_prompt: "&e请在宽限期内输入 &f/alinvite bind [邀请码]&e，或请邀请人执行 &f/alinvite add 你的玩家名&e。"
  reminder: "&e请及时使用 &f/alinvite bind [邀请码]&e，或让邀请人用 &f/alinvite add 你的玩家名 &e替你完成邀请。"
  kick_message: "&c请输入邀请码~\n&f使用 /alinvite bind [邀请码] 完成绑定后才能进入服务器"
  registration_success: "&a你已获得本期开放注册资格，可以直接进入服务器；注册码不会显示。"
  command_blocked: "&c绑定邀请码之前只能使用 &f/alinvite bind [邀请码]"
  chat_blocked: "&c绑定邀请码之前无法聊天，请先 &f/alinvite bind [邀请码]"
# 邀请名额
invite_quota:
  granted: "&a你的累计游玩时长已达到要求，获得 &e{amount} &a个邀请名额"

